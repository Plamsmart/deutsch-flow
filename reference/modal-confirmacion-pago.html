<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmación de pago — Deutsch Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --deep-teal: #005461;
    --teal: #018790;
    --turquoise: #00b7b5;
    --off-white: #f4f4f4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Work Sans', sans-serif;
    background: #0a0a0a;
    min-height: 100vh;
  }

  /* --- Overlay + Modal --- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(4,40,45,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    z-index: 300;
  }

  .modal {
    position: relative;
    background: linear-gradient(160deg, #06232a 0%, var(--deep-teal) 100%);
    border: 1px solid rgba(0,183,181,0.25);
    border-radius: 22px;
    width: 100%;
    max-width: 420px;
    padding: 2.6rem 2.2rem 2.2rem;
    text-align: center;
    box-shadow: 0 30px 70px rgba(0,0,0,0.5);
    overflow: hidden;
  }

  .close-btn {
    position: absolute;
    top: 1rem;
    right: 1rem;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: rgba(244,244,244,0.08);
    color: var(--off-white);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1rem;
    transition: background 0.2s ease;
  }
  .close-btn:hover { background: rgba(244,244,244,0.18); }

  .icon-cluster {
    position: relative;
    width: 108px;
    height: 108px;
    margin: 0 auto 1.4rem;
  }

  .icon-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid var(--turquoise);
    opacity: 0.4;
  }

  .icon-boat-img {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 76px;
    height: auto;
  }

  .checkmark {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--turquoise);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 3px solid #06232a;
  }

  .checkmark svg { width: 14px; height: 14px; stroke: var(--deep-teal); stroke-width: 3; }

  .stamp-corner {
    position: absolute;
    top: -18px;
    right: -14px;
    width: 58px;
    opacity: 0.85;
    transform: rotate(8deg);
  }

  .eyebrow {
    font-size: 0.74rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--turquoise);
    font-weight: 600;
    margin-bottom: 0.5rem;
  }

  h3 {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 1.5rem;
    color: var(--off-white);
    margin-bottom: 0.8rem;
    line-height: 1.25;
  }

  p {
    font-size: 0.92rem;
    line-height: 1.6;
    color: var(--off-white);
    opacity: 0.75;
    font-weight: 300;
    margin-bottom: 1.6rem;
  }

  .progress-track {
    height: 3px;
    width: 100%;
    background: rgba(244,244,244,0.12);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 100%;
    background: var(--turquoise);
    border-radius: 999px;
    transform-origin: left;
    animation: shrink 7s linear forwards;
  }

  @keyframes shrink {
    from { transform: scaleX(1); }
    to { transform: scaleX(0); }
  }
</style>
</head>
